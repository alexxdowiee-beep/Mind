<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mind</title>
<meta name="theme-color" content="#0A0A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mind">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Forge palette: shared dark look across the app ecosystem (same as Forge & Fuel). */
  :root {
    --bg: #0A0A0B;
    --bg-raised: #141416;
    --surface2: #1D1E21;
    --ink: #F5F5F6;
    --ink-soft: #A1A2A7;
    --ink-faint: #7D7F85;
    --line: #26272B;
    --brand: #FF4A16;
    --brand-ink: #120B07;
    --brand-soft: rgba(255,74,22,0.12);
    --accent: #F0B429;
    --warn: #E5484D;
    --radius-lg: 16px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-display: 'Anton', 'Arial Narrow', 'Haettenschweiler', sans-serif;
    --font-body: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
    color-scheme: dark;
  }

  /* ===================== STRUCTURAL (shared template) ===================== */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }

  .app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  header.topbar {
    position: sticky; top: 0; z-index: 20;
    padding: calc(env(safe-area-inset-top,0px) + 18px) 20px 12px;
    margin-top: calc(env(safe-area-inset-top,0px) * -1);
    margin-bottom: 14px;
    background: var(--bg); border-bottom: 2px solid var(--brand);
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar .brand { display:flex; align-items:center; gap:9px; font-family: var(--font-display); font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; }
  header.topbar .brand svg { width: 26px; height: 26px; flex-shrink: 0; }
  header.topbar .subline { font-size: 12px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  main { flex: 1; padding: 0 20px 100px; overflow-x: hidden; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadein .18s ease; }
  @keyframes fadein { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform: none;} }

  .section-head { display:flex; align-items:baseline; justify-content:space-between; margin: 26px 0 10px; }
  .section-head h2 { font-size: 15px; margin:0; text-transform: uppercase; letter-spacing: 0.05em; }
  .section-head .hint { font-size: 12px; color: var(--ink-faint); }

  .card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; }

  .empty-state { text-align:center; padding: 34px 10px; color: var(--ink-soft); }
  .empty-state .emoji { font-size: 30px; margin-bottom:8px; }
  .empty-state p { font-size: 14px; margin: 4px 0; }

  .btn { border:none; border-radius: 14px; padding: 13px 20px; font-size: 15px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); width:100%; font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: 0.09em; text-transform: uppercase; }
  .btn.ghost { background: var(--surface2); border: 1px solid var(--line); color: var(--ink); width:100%; }
  .btn.danger-text { background:none; color: var(--warn); font-weight:700; text-decoration:underline; padding:8px 4px; }
  .btn:active { transform: scale(0.98); }

  .field { display:flex; flex-direction:column; gap:4px; flex:1; min-width: 70px; margin-top: 12px; }
  .field label { font-size: 12px; color: var(--ink-faint); font-weight:700; text-transform: uppercase; letter-spacing: 0.05em; }
  input[type=text], input[type=number], textarea {
    background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px;
    font-size: 15px; font-family: inherit; color: var(--ink); width:100%;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; }

  nav.tabbar { position: fixed; left:0; right:0; bottom:0; z-index: 30; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg-raised); border-top: 1px solid var(--line); }
  .tabbar-inner { max-width:520px; margin:0 auto; display:flex; }
  .tab { flex:1; border:none; background:none; padding: 11px 4px 9px; display:flex; flex-direction:column; align-items:center; gap:3px; color: var(--ink-faint); cursor:pointer; }
  .tab.active { color: var(--brand); }
  .tab .ic { display:inline-block; padding:2px 14px; border-radius:999px; transition:background .15s; }
  .tab.active .ic { background: rgba(255,74,22,.16); }

  .tab .ic { font-size: 19px; }
  .tab .lb { font-size: 12px; font-weight:700; }

  .modal-scrim { position:fixed; inset:0; background: rgba(6,7,8,0.8); z-index:50; display:none; align-items:flex-end; }
  .modal-scrim.open { display:flex; }
  .modal-sheet { background: var(--bg-raised); border-top: 2px solid var(--brand); width:100%; max-width:520px; margin:0 auto; border-radius: 22px 22px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom,0px) + 24px); max-height: 86vh; overflow-y:auto; }
  .modal-sheet h3 { margin: 0; font-size:17px; text-transform: uppercase; letter-spacing: 0.05em; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; }
  .close-x { background:none; border:none; font-size:20px; color: var(--ink-faint); cursor:pointer; }

  .toast { position: fixed; left:50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom,0px) + 84px); background: var(--ink); color: var(--bg); font-weight: 700; font-size:13px; padding:10px 18px; border-radius:999px; z-index:60; opacity:0; pointer-events:none; transition: opacity .25s, bottom .25s; white-space: nowrap; }
  .toast.show { opacity:1; bottom: calc(env(safe-area-inset-bottom,0px) + 100px); }

  /* ===================== MIND — app-specific ===================== */
  .timer-card { background: var(--bg-raised); border: 1px solid var(--brand); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 14px; }
  .timer-card.paused { border-color: var(--line); }
  .tm-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .tm-name { font-weight:700; font-size:14px; }
  .tm-state { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color: var(--brand); }
  .timer-card.paused .tm-state { color: var(--ink-faint); }
  .tm-clock { font-family: var(--font-display); font-size: 46px; line-height: 1.1; margin: 8px 0 6px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .tm-target { font-size: 12px; color: var(--ink-soft); margin-top: 6px; font-weight:600; }
  .tm-btns { display:grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 14px; }
  .ex-row .log-btn.tm { margin-right: 6px; background: var(--surface2); color: var(--brand); border: 1px solid var(--line); }
  .ring-card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; display:flex; align-items:center; gap: 20px; }
  .ring-wrap { position: relative; width: 112px; height: 112px; flex-shrink:0; }
  .ring-wrap svg { transform: rotate(-90deg); width:100%; height:100%; }
  .ring-track { fill:none; stroke: var(--surface2); stroke-width: 10; }
  .ring-fill { fill:none; stroke: var(--brand); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-center .num { font-family: var(--font-display); font-size: 30px; line-height:1; font-variant-numeric: tabular-nums; }
  .ring-center .lbl { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; font-weight:700; margin-top:4px; }
  .ring-meta { flex:1; }
  .ring-meta .row { display:flex; justify-content:space-between; align-items:baseline; font-size: 14px; padding: 4px 0; color: var(--ink-soft); }
  .ring-meta .row b { color: var(--ink); font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: 0.02em; }
  .ring-meta .row b.streak { color: var(--accent); }

  .cat-list { display:flex; flex-direction:column; gap:8px; }
  .cat-card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 13px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; text-align:left; width:100%; color: var(--ink); }
  .cat-card:active { border-color: var(--brand); }
  .cat-emoji { font-size: 21px; width:30px; text-align:center; flex-shrink:0; }
  .cat-body { flex:1; min-width:0; display:block; }
  .cat-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .cat-name { font-size:15px; font-weight:700; }
  .cat-amt { font-family: var(--font-display); font-size:15px; letter-spacing:0.02em; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .cat-amt span { color: var(--ink-faint); }
  .cat-sub { display:block; font-size:12px; color: var(--ink-soft); margin-top:2px; }
  .bar-track { display:block; height:6px; background: var(--surface2); border-radius:999px; margin-top:8px; overflow:hidden; }
  .bar-fill { display:block; height:100%; background: var(--brand); border-radius:999px; transition: width .4s ease; }
  .bar-fill.done { background: var(--accent); }
  .cat-plus { width:30px; height:30px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:18px; color: var(--ink); flex-shrink:0; }
  .cat-plus.done { color: var(--accent); }

  .log-item { display:flex; align-items:center; gap:12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .log-item:last-child { border-bottom:none; }
  .log-item.tappable { cursor:pointer; }
  .log-item.tappable:active .name { color: var(--brand); }
  .log-item .info { flex:1; min-width:0; }
  .log-item .name { font-size: 14px; font-weight:600; }
  .log-item .sub { font-size: 12px; color: var(--ink-soft); margin-top:2px; }
  .log-item .mins { font-family: var(--font-display); font-size:15px; letter-spacing:0.02em; }
  .icon-btn { background:none; border:none; color: var(--ink-faint); font-size: 17px; cursor:pointer; padding:4px 6px; line-height:1; }

  .chip-row { display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
  .chip { border:1px solid var(--line); background: var(--surface2); color: var(--ink-soft); border-radius:20px; padding:8px 13px; font-size:13px; font-weight:700; cursor:pointer; }
  .chip.active { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .chip.add { border-style: dashed; color: var(--brand); background: transparent; }
  .step-label { font-size: 12px; color: var(--ink-faint); font-weight:700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 16px; }
  .ex-note { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink-soft); margin-top: 10px; line-height: 1.45; white-space: pre-wrap; display:none; }
  .ex-note.show { display:block; }
  .min-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:7px; margin-top: 8px; }
  .min-grid .chip { text-align:center; padding: 10px 4px; border-radius: 10px; }

  .group-head { display:flex; justify-content:space-between; align-items:baseline; margin: 22px 0 4px; padding-bottom: 5px; border-bottom: 1.5px solid var(--line); }
  .group-head h3 { font-size: 14px; margin:0; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }
  .group-head .add-mini { background:none; border:none; color: var(--brand); font-size: 13px; font-weight: 700; cursor:pointer; padding: 2px; }
  .ex-row { display:flex; align-items:center; gap:10px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .ex-row:last-child { border-bottom:none; }
  .ex-row .info { flex:1; min-width:0; cursor:pointer; }
  .ex-row .name { font-size: 15px; font-weight:600; }
  .ex-row .sub { font-size: 12px; color: var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow: ellipsis; white-space:nowrap; }
  .ex-row .log-btn { border:none; border-radius:10px; padding: 8px 13px; font-size: 13px; font-weight: 700; background: var(--brand); color: var(--brand-ink); cursor:pointer; flex-shrink:0; }
  .ex-empty { font-size: 13px; color: var(--ink-faint); padding: 10px 2px; }

  .week-card { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom:10px; }
  .week-head { display:flex; justify-content:space-between; align-items:baseline; }
  .week-head .range { font-weight:700; font-size:14px; }
  .week-head .pct { font-family: var(--font-display); font-size:17px; color: var(--brand); letter-spacing: 0.02em; }
  .week-head .pct.done { color: var(--accent); }
  .week-mini { display:grid; grid-template-columns: repeat(3, 1fr); gap:6px 10px; margin-top:10px; font-size:12px; color: var(--ink-soft); }
  .week-mini b { color: var(--ink); font-weight: 700; }

  .target-group { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 4px 14px; }
  .target-row { display:flex; align-items:center; gap:12px; padding: 11px 0; border-bottom:1px solid var(--line); }
  .target-row:last-child { border-bottom:none; }
  .target-row .te { font-size:19px; width:26px; text-align:center; }
  .target-row .tl { flex:1; font-size:15px; font-weight:600; }
  .target-row .t-input { display:flex; align-items:center; gap:6px; width:120px; }
  .target-row .t-input input { text-align:right; }
  .target-row .t-unit { font-size:12px; color: var(--ink-soft); width:28px; }
  .note { font-size: 12px; color: var(--ink-faint); margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand"><svg viewBox="68 68 376 376" aria-hidden="true"><path d="M390.2,154.9 A168,168 0 0 1 179.7,405.7 M121.8,357.1 A168,168 0 0 1 332.3,106.3" fill="none" stroke="var(--brand)" stroke-width="30"/><g fill="var(--ink)" transform="translate(256 256) skewX(-12) translate(-256 -256) translate(171.0 156)"><polygon points="0,200 0,0 46,0 85,78 124,0 170,0 170,200 124,200 124,88 98,140 72,140 46,88 46,200"/></g></svg>Mind</span>
    <span class="subline" id="topSubline"></span>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen active" id="screen-home">
      <div id="timerCard"></div>
      <div class="ring-card">
        <div class="ring-wrap">
          <svg viewBox="0 0 118 118">
            <circle class="ring-track" cx="59" cy="59" r="50"></circle>
            <circle class="ring-fill" id="ringFill" cx="59" cy="59" r="50" stroke-dasharray="314.16" stroke-dashoffset="314.16"></circle>
          </svg>
          <div class="ring-center"><div class="num" id="ringPct">0%</div><div class="lbl">this week</div></div>
        </div>
        <div class="ring-meta">
          <div class="row"><span>Done</span><b id="metaDone">0m</b></div>
          <div class="row"><span>Target</span><b id="metaTarget">0m</b></div>
          <div class="row"><span>Streak</span><b class="streak" id="metaStreak">0 wks</b></div>
        </div>
      </div>

      <div class="section-head"><h2>Weekly Progress</h2><span class="hint">tap to log</span></div>
      <div class="cat-list" id="catList"></div>

      <div class="section-head"><h2>This Week's Log</h2></div>
      <div id="weekLog"></div>
    </section>

    <!-- EXERCISES -->
    <section class="screen" id="screen-exercises">
      <button class="btn primary" id="addExerciseBtn">+ Add Exercise</button>
      <div id="exerciseList"></div>
    </section>

    <!-- HISTORY -->
    <section class="screen" id="screen-history">
      <div class="section-head"><h2>History</h2></div>
      <div id="historyList"></div>
    </section>

    <!-- TARGETS -->
    <section class="screen" id="screen-targets">
      <div class="section-head"><h2>Weekly Targets</h2><span class="hint">minutes / week</span></div>
      <div class="target-group" id="targetList"></div>
      <button class="btn primary" id="saveTargets" style="margin-top:16px;">Save Targets</button>
      <p class="note">Weeks run Monday to Sunday. Your streak counts weeks where you hit your total weekly target.</p>
      <div class="section-head"><h2>Backup</h2></div>
      <div id="backupStatus"></div>
    </section>
  </main>

  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab active" data-screen="home"><span class="ic">◉</span><span class="lb">Home</span></button>
      <button class="tab" data-screen="exercises"><span class="ic">✦</span><span class="lb">Exercises</span></button>
      <button class="tab" data-screen="history"><span class="ic">▤</span><span class="lb">History</span></button>
      <button class="tab" data-screen="targets"><span class="ic">◎</span><span class="lb">Targets</span></button>
    </div>
  </nav>
</div>

<div class="modal-scrim" id="genericModalScrim">
  <div class="modal-sheet">
    <div class="modal-head"><h3 id="genericModalTitle">Edit</h3><button class="close-x" id="genericModalClose">✕</button></div>
    <div id="genericModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  /* ============================================================
     SHARED HELPERS — identical across every app in the ecosystem.
     ============================================================ */
  const APP_PREFIX = 'forgemind_';

  const $ = (id) => document.getElementById(id);
  const uid_ = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const escapeHtml = (s) => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(APP_PREFIX + key); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    },
    set(key, val) {
      try { localStorage.setItem(APP_PREFIX + key, JSON.stringify(val)); }
      catch (e) { console.error('Storage failed', e); toast('Could not save — storage may be full'); }
    }
  };

  let onScreenEnter = null;
  function switchScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $('screen-' + name).classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.screen === name));
    if (typeof onScreenEnter === 'function') onScreenEnter(name);
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchScreen(t.dataset.screen)));

  function openModal(title, bodyHtml, wireFn) {
    $('genericModalTitle').textContent = title;
    $('genericModalBody').innerHTML = bodyHtml;
    $('genericModalScrim').classList.add('open');
    if (typeof wireFn === 'function') wireFn();
  }
  function closeModal() { $('genericModalScrim').classList.remove('open'); }
  $('genericModalClose').addEventListener('click', closeModal);
  $('genericModalScrim').addEventListener('click', (e) => { if (e.target === $('genericModalScrim')) closeModal(); });

  /* ============================================================
     MIND — app-specific code
     Data (all in localStorage, prefixed forgemind_):
       targets   { catKey: minutesPerWeek }
       exercises [ { id, cat, name, notes, mins } ]
       entries   [ { id, date:'YYYY-MM-DD', cat, exId|null, mins } ]
     ============================================================ */

  const CATEGORIES = [
    { key: 'reading',    label: 'Reading',        emoji: '📖' },
    { key: 'learning',   label: 'Learning',       emoji: '🧠' },
    { key: 'focus',      label: 'Focus Training', emoji: '🎯' },
    { key: 'meditation', label: 'Meditation',     emoji: '🧘' },
    { key: 'breathing',  label: 'Breathing',      emoji: '🌬️' },
    { key: 'braingames', label: 'Brain Games',    emoji: '🧩' }
  ];
  const catBy = (k) => CATEGORIES.find(c => c.key === k);

  const DEFAULT_TARGETS = { reading: 180, learning: 120, focus: 60, meditation: 60, breathing: 30, braingames: 30 };

  // A few starter exercises so the app isn't empty. All editable / deletable.
  const STARTER_EXERCISES = [
    { cat: 'reading',    name: 'Book reading', mins: 30, notes: '' },
    { cat: 'learning',   name: 'Online course', mins: 30, notes: '' },
    { cat: 'learning',   name: 'Language practice', mins: 15, notes: '' },
    { cat: 'focus',      name: 'Deep work block', mins: 25, notes: 'Pick one task. Phone out of reach. Work without switching until the timer ends.' },
    { cat: 'focus',      name: 'Single-point focus', mins: 5, notes: 'Rest your eyes on one point (a dot, a candle). When your attention drifts, notice it and bring it back.' },
    { cat: 'meditation', name: 'Guided meditation', mins: 10, notes: '' },
    { cat: 'meditation', name: 'Body scan', mins: 10, notes: 'Slowly move attention from your feet to your head, noticing sensations without trying to change them.' },
    { cat: 'breathing',  name: 'Box breathing', mins: 5, notes: 'In for 4 · hold 4 · out for 4 · hold 4. Repeat.' },
    { cat: 'breathing',  name: '4-7-8 breathing', mins: 5, notes: 'In through the nose for 4 · hold 7 · out slowly through the mouth for 8.' },
    { cat: 'braingames', name: 'Sudoku', mins: 15, notes: '' },
    { cat: 'braingames', name: 'Chess puzzles', mins: 15, notes: '' }
  ];

  const getTargets = () => Object.assign({}, DEFAULT_TARGETS, store.get('targets', {}));
  const getExercises = () => store.get('exercises', []);
  const getEntries = () => store.get('entries', []);

  // ---------- dates & weeks (Monday start, local time) ----------
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  function weekStart(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  const weekKey = (d) => ymd(weekStart(d));
  const thisWeekKey = () => weekKey(new Date());
  function weekRangeLabel(key) {
    const s = parseYmd(key); const e = new Date(s); e.setDate(e.getDate() + 6);
    const o = { month: 'short', day: 'numeric' };
    return `${s.toLocaleDateString(undefined, o)} – ${e.toLocaleDateString(undefined, o)}`;
  }

  function formatMins(m) {
    m = Math.round(m || 0);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h}h ${r}m` : `${h}h`;
  }

  // Totals per category for one week
  function weekTotals(key) {
    const t = {}; CATEGORIES.forEach(c => t[c.key] = 0);
    getEntries().forEach(e => { if (weekKey(parseYmd(e.date)) === key && t[e.cat] !== undefined) t[e.cat] += e.mins; });
    return t;
  }
  const sum = (obj) => Object.values(obj).reduce((a, b) => a + b, 0);

  // Weekly % = each category capped at its own target, so overdoing one
  // category can't fake a full week.
  function weekPct(totals, targets) {
    const tt = sum(targets); if (tt <= 0) return 0;
    let got = 0; CATEGORIES.forEach(c => got += Math.min(totals[c.key] || 0, targets[c.key] || 0));
    return Math.round((got / tt) * 100);
  }

  // Streak: consecutive completed weeks. The current week only adds to the
  // streak once it's complete — an unfinished week doesn't break it.
  function computeStreak() {
    const targets = getTargets();
    let streak = 0;
    if (weekPct(weekTotals(thisWeekKey()), targets) >= 100) streak++;
    const cursor = weekStart(new Date());
    for (let i = 0; i < 520; i++) {
      cursor.setDate(cursor.getDate() - 7);
      if (weekPct(weekTotals(ymd(cursor)), targets) >= 100) streak++; else break;
    }
    return streak;
  }

  // ---------- ecosystem summary: the only thing the Dashboard app reads ----------
  // Written to a fixed key ("mind_summary") every time the Home screen
  // refreshes — which happens after every log, edit, delete and target
  // change — so the Dashboard always sees current numbers. See the
  // "App Bundle: Data Sharing Spec" for the shared contract this follows.
  // Bump SUMMARY_VERSION only if a field below is renamed or removed.
  const SUMMARY_VERSION = 1;

  // Days in a row with anything logged. Today only counts once something
  // is logged, so an empty morning doesn't break yesterday's streak.
  function dayStreak() {
    const days = new Set(getEntries().filter(e => e.mins > 0).map(e => e.date));
    const d = new Date();
    if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while (days.has(ymd(d)) && n < 3650) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function publishSummary(totals, targets, pct, weekStreak) {
    try {
      const done = sum(totals), target = sum(targets);
      const todayMins = getEntries().filter(e => e.date === ymd(new Date())).reduce((a, e) => a + (e.mins || 0), 0);
      const headline = done > 0
        ? `${formatMins(done)} of ${formatMins(target)} this week (${pct}%)`
        : 'Nothing logged this week yet';
      localStorage.setItem('mind_summary', JSON.stringify({
        schemaVersion: SUMMARY_VERSION,
        updatedAt: new Date().toISOString(),
        appId: 'mind',
        headline: headline,
        data: {
          weekMinutesLogged: done,
          weekMinutesTarget: target,
          weekPercent: pct,
          todayMinutes: todayMins,
          loggedToday: todayMins > 0,
          currentStreakDays: dayStreak(),
          currentStreakWeeks: weekStreak,
          // ---- detail for the Dashboard's charts and suggestions ----
          byCategory: CATEGORIES.map(c => {
            const done = getEntries().filter(e => e.cat === c.key && e.mins > 0).map(e => e.date).sort();
            return { key: c.key, label: c.label, mins: totals[c.key] || 0, target: targets[c.key] || 0,
                     lastDone: done.length ? done[done.length - 1] : null };
          }),
          weeklyTotals: (function () {           // last 8 weeks, oldest first
            const out = [], cur = weekStart(new Date());
            for (let i = 7; i >= 0; i--) {
              const d = new Date(cur); d.setDate(d.getDate() - i * 7);
              const t = weekTotals(ymd(d));
              out.push({ week: ymd(d), mins: sum(t), target: sum(targets) });
            }
            return out;
          })(),
          activeDates: [...new Set(getEntries().filter(e => e.mins > 0 && (Date.now() - parseYmd(e.date).getTime()) < 70 * 864e5).map(e => e.date))].sort()
        }
      }));
    } catch (e) { /* never let the summary break the app */ }
  }

  // ---------- logging ----------
  function addEntry(cat, exId, mins) {
    const entries = getEntries();
    entries.push({ id: uid_(), date: ymd(new Date()), cat, exId: exId || null, mins });
    store.set('entries', entries);
    const ex = exId ? getExercises().find(x => x.id === exId) : null;
    toast(`+${formatMins(mins)} ${ex ? ex.name : catBy(cat).label}`);
    renderHome();
  }


  // ---------- session timer ----------
  // Stored, not just kept in memory, so it keeps counting if the phone
  // locks or the app is closed. Time is always worked out from the
  // start time, so nothing is lost while the app isn't open.
  //   timer = { cat, exId, startedAt (ms, null while paused), accMs, targetMins, alerted }
  const getTimer = () => store.get('timer', null);
  function timerElapsed(t) { return (t.accMs || 0) + (t.startedAt ? Date.now() - t.startedAt : 0); }
  function clock(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    return (h ? h + ':' + pad(m) : m) + ':' + pad(sec);
  }
  function timerName(t) {
    const ex = t.exId ? getExercises().find(x => x.id === t.exId) : null;
    const c = catBy(t.cat);
    return (c ? c.emoji + ' ' : '') + (ex ? ex.name : (c ? c.label : 'Session'));
  }
  function startTimer(cat, exId, targetMins) {
    const running = getTimer();
    if (running && !confirm('A timer is already running for ' + timerName(running) + '. Replace it?')) return;
    store.set('timer', { cat, exId: exId || null, startedAt: Date.now(), accMs: 0, targetMins: targetMins || null, alerted: false });
    switchScreen('home');
    renderTimer();
    toast('Timer started');
  }
  function pauseTimer() {
    const t = getTimer(); if (!t) return;
    if (t.startedAt) { t.accMs = timerElapsed(t); t.startedAt = null; } else { t.startedAt = Date.now(); }
    store.set('timer', t); renderTimer();
  }
  function stopTimer() {
    const t = getTimer(); if (!t) return;
    const mins = Math.max(1, Math.round(timerElapsed(t) / 60000));
    openModal('Log session', `
      <div class="ex-note show">${escapeHtml(timerName(t))} · ${clock(timerElapsed(t))} on the timer</div>
      <div class="field"><label>Minutes to log</label><input type="number" id="tmMins" min="1" inputmode="numeric" value="${mins}"></div>
      <button class="btn primary" id="tmLog" style="margin-top:16px;">Log ${formatMins(mins)}</button>
      <div style="text-align:center;margin-top:8px;"><button class="btn danger-text" id="tmDiscard">Discard session</button></div>`, () => {
      $('tmMins').addEventListener('input', () => { const v = parseInt($('tmMins').value, 10); $('tmLog').textContent = v > 0 ? 'Log ' + formatMins(v) : 'Log'; });
      $('tmLog').addEventListener('click', () => {
        const v = parseInt($('tmMins').value, 10);
        if (!(v > 0)) { toast('Enter the minutes'); return; }
        store.set('timer', null); closeModal(); addEntry(t.cat, t.exId, v); renderTimer();
      });
      $('tmDiscard').addEventListener('click', () => {
        if (!confirm('Throw this session away without logging it?')) return;
        store.set('timer', null); closeModal(); renderTimer(); toast('Session discarded');
      });
    });
  }
  function renderTimer() {
    const el = $('timerCard'); if (!el) return;
    const t = getTimer();
    if (!t) { el.innerHTML = ''; return; }
    const paused = !t.startedAt;
    el.innerHTML = `
      <div class="timer-card${paused ? ' paused' : ''}">
        <div class="tm-top"><span class="tm-name">${escapeHtml(timerName(t))}</span><span class="tm-state">${paused ? 'Paused' : 'Running'}</span></div>
        <div class="tm-clock" id="tmClock">${clock(timerElapsed(t))}</div>
        ${t.targetMins ? `<div class="bar-track"><span class="bar-fill" id="tmBar" style="width:0%"></span></div><div class="tm-target" id="tmTarget"></div>` : ''}
        <div class="tm-btns">
          <button class="btn ghost" id="tmPause">${paused ? '▶ Resume' : '❚❚ Pause'}</button>
          <button class="btn primary" id="tmStop">Stop &amp; log</button>
        </div>
      </div>`;
    $('tmPause').addEventListener('click', pauseTimer);
    $('tmStop').addEventListener('click', stopTimer);
    tickTimer();
  }
  // Updates just the numbers once a second (cheap; no redraw).
  function tickTimer() {
    const t = getTimer(); if (!t || !$('tmClock')) return;
    const ms = timerElapsed(t);
    $('tmClock').textContent = clock(ms);
    if (t.targetMins && $('tmBar')) {
      const pct = Math.min(100, ms / (t.targetMins * 60000) * 100);
      $('tmBar').style.width = pct + '%';
      $('tmBar').classList.toggle('done', pct >= 100);
      $('tmTarget').textContent = pct >= 100 ? `✓ ${formatMins(t.targetMins)} reached — keep going or stop & log` : `of ${formatMins(t.targetMins)}`;
      if (pct >= 100 && !t.alerted) {
        t.alerted = true; store.set('timer', t);
        try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {}
        toast(`${formatMins(t.targetMins)} done ✓`);
      }
    }
  }
  setInterval(tickTimer, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) renderTimer(); });

  // Log sheet: pick an exercise in the category (optional), then a duration.
  function openLogSheet(cat, preselectExId) {
    const c = catBy(cat);
    const exs = getExercises().filter(x => x.cat === cat);
    let selected = preselectExId || null;
    let mins = null;

    const exChips = exs.map(x => `<button class="chip${x.id === selected ? ' active' : ''}" data-ex="${x.id}">${escapeHtml(x.name)}</button>`).join('');
    const body = `
      <div class="step-label">Exercise</div>
      <div class="chip-row" id="exChips">
        <button class="chip${selected ? '' : ' active'}" data-ex="">General</button>
        ${exChips}
        <button class="chip add" id="newExFromLog">+ New</button>
      </div>
      <div class="ex-note" id="exNote"></div>
      <div class="step-label">Time</div>
      <div class="min-grid" id="minGrid">
        ${[5, 10, 15, 20, 30, 45, 60, 90].map(m => `<button class="chip" data-m="${m}">${formatMins(m)}</button>`).join('')}
      </div>
      <div class="field"><label>Or custom minutes</label><input type="number" id="customMins" min="1" inputmode="numeric" placeholder="e.g. 25"></div>
      <button class="btn primary" id="logBtn" style="margin-top:18px;">Log Time</button>
      <button class="btn ghost" id="timerStartBtn" style="margin-top:8px;">▶ Start a timer instead</button>`;

    openModal(`${c.emoji}  ${c.label}`, body, () => {
      const showNote = () => {
        const ex = exs.find(x => x.id === selected);
        const n = $('exNote');
        n.textContent = ex && ex.notes ? ex.notes : '';
        n.classList.toggle('show', !!(ex && ex.notes));
      };
      const setMins = (m) => {
        mins = m;
        document.querySelectorAll('#minGrid .chip').forEach(b => b.classList.toggle('active', parseInt(b.dataset.m, 10) === m));
        $('logBtn').textContent = m ? `Log ${formatMins(m)}` : 'Log Time';
      };
      // Pre-fill the exercise's usual duration
      const applyDefault = () => { const ex = exs.find(x => x.id === selected); if (ex && ex.mins) { $('customMins').value = ''; setMins(ex.mins); } };

      document.querySelectorAll('#exChips [data-ex]').forEach(b => b.addEventListener('click', () => {
        selected = b.dataset.ex || null;
        document.querySelectorAll('#exChips [data-ex]').forEach(x => x.classList.toggle('active', x === b));
        showNote(); applyDefault();
      }));
      document.querySelectorAll('#minGrid .chip').forEach(b => b.addEventListener('click', () => { $('customMins').value = ''; setMins(parseInt(b.dataset.m, 10)); }));
      $('customMins').addEventListener('input', () => { const v = parseInt($('customMins').value, 10); setMins(v > 0 ? v : null); });
      $('newExFromLog').addEventListener('click', () => openExerciseEditor(null, cat, true));
      $('timerStartBtn').addEventListener('click', () => {
        closeModal(); startTimer(cat, selected, mins);
      });
      $('logBtn').addEventListener('click', () => {
        if (!mins || mins <= 0) { toast('Pick a time first'); return; }
        addEntry(cat, selected, mins); closeModal();
      });
      showNote(); applyDefault();
    });
  }

  // ---------- HOME ----------
  function renderHome() {
    const targets = getTargets();
    const key = thisWeekKey();
    const totals = weekTotals(key);
    const exs = getExercises();

    $('topSubline').textContent = weekRangeLabel(key);

    $('catList').innerHTML = CATEGORIES.map(c => {
      const done = totals[c.key], target = targets[c.key] || 0;
      const pct = target > 0 ? Math.min(100, Math.round(done / target * 100)) : 0;
      const complete = target > 0 && done >= target;
      const n = exs.filter(x => x.cat === c.key).length;
      return `
        <button class="cat-card" data-cat="${c.key}">
          <span class="cat-emoji">${c.emoji}</span>
          <span class="cat-body">
            <span class="cat-top"><span class="cat-name">${c.label}</span><span class="cat-amt">${formatMins(done)} <span>/ ${formatMins(target)}</span></span></span>
            <span class="cat-sub">${n} exercise${n === 1 ? '' : 's'}</span>
            <span class="bar-track"><span class="bar-fill${complete ? ' done' : ''}" style="width:${pct}%"></span></span>
          </span>
          <span class="cat-plus${complete ? ' done' : ''}">${complete ? '✓' : '+'}</span>
        </button>`;
    }).join('');
    document.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => openLogSheet(b.dataset.cat)));

    const pct = weekPct(totals, targets);
    $('ringPct').textContent = pct + '%';
    $('ringFill').setAttribute('stroke-dashoffset', (314.16 * (1 - Math.min(pct, 100) / 100)).toFixed(2));
    $('metaDone').textContent = formatMins(sum(totals));
    $('metaTarget').textContent = formatMins(sum(targets));
    const s = computeStreak();
    $('metaStreak').textContent = `🔥 ${s} wk${s === 1 ? '' : 's'}`;
    publishSummary(totals, targets, pct, s);

    // This week's individual entries (newest first) with delete, so mistakes can be undone
    const list = getEntries().filter(e => weekKey(parseYmd(e.date)) === key).reverse();
    if (!list.length) {
      $('weekLog').innerHTML = `<div class="empty-state"><div class="emoji">🧠</div><p>Nothing logged yet this week.</p><p>Tap a category above to start.</p></div>`;
      return;
    }
    $('weekLog').innerHTML = `<div class="card" style="padding:2px 14px;">${list.map(e => {
      const c = catBy(e.cat); const ex = e.exId ? exs.find(x => x.id === e.exId) : null;
      const day = parseYmd(e.date).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
      return `<div class="log-item tappable" data-edit="${e.id}">
          <span class="cat-emoji">${c ? c.emoji : '•'}</span>
          <div class="info"><div class="name">${escapeHtml(ex ? ex.name : (c ? c.label : 'Entry'))}</div><div class="sub">${day}${ex ? ' · ' + c.label : ''}</div></div>
          <span class="mins">${formatMins(e.mins)}</span>
          <button class="icon-btn" data-del="${e.id}" aria-label="Delete">✕</button>
        </div>`;
    }).join('')}</div>`;
    document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('Delete this entry?')) return;
      store.set('entries', getEntries().filter(e => e.id !== b.dataset.del));
      toast('Entry deleted'); renderHome();
    }));
    document.querySelectorAll('[data-edit]').forEach(row => row.addEventListener('click', (ev) => {
      if (ev.target.closest('[data-del]')) return;   // the X is its own shortcut
      openEntryEditor(row.dataset.edit);
    }));
  }

  // Edit something already logged: how long it was, what it was, or which
  // day it belongs to. Mis-taps and forgotten days are the two things that
  // actually go wrong, and neither could be fixed before.
  function openEntryEditor(id) {
    const entry = getEntries().find(e => e.id === id);
    if (!entry) return;
    let cat = entry.cat;
    let exId = entry.exId || null;

    const exChipsFor = (c) =>
      `<button class="chip${exId ? '' : ' active'}" data-eex="">General</button>` +
      getExercises().filter(x => x.cat === c)
        .map(x => `<button class="chip${x.id === exId ? ' active' : ''}" data-eex="${x.id}">${escapeHtml(x.name)}</button>`).join('');

    const body = `
      <div class="step-label">Category</div>
      <div class="chip-row" id="edCats">
        ${CATEGORIES.map(c => `<button class="chip${c.key === cat ? ' active' : ''}" data-ecat="${c.key}">${c.emoji} ${c.label}</button>`).join('')}
      </div>
      <div class="step-label">Exercise</div>
      <div class="chip-row" id="edExs">${exChipsFor(cat)}</div>
      <div class="field"><label>Minutes</label><input type="number" id="edMins" min="1" inputmode="numeric" value="${Number(entry.mins) || 0}"></div>
      <div class="field"><label>Day</label><input type="date" id="edDate" value="${entry.date}"></div>
      <button class="btn primary" id="edSave" style="margin-top:18px;">Save Changes</button>
      <div style="text-align:center;margin-top:8px;"><button class="btn danger-text" id="edDel">Delete entry</button></div>`;

    openModal('Edit Entry', body, () => {
      function wireEx() {
        document.querySelectorAll('[data-eex]').forEach(b => b.addEventListener('click', () => {
          exId = b.dataset.eex || null;
          document.querySelectorAll('[data-eex]').forEach(x => x.classList.toggle('active', x === b));
        }));
      }
      document.querySelectorAll('[data-ecat]').forEach(b => b.addEventListener('click', () => {
        cat = b.dataset.ecat; exId = null;
        document.querySelectorAll('[data-ecat]').forEach(x => x.classList.toggle('active', x === b));
        $('edExs').innerHTML = exChipsFor(cat);
        wireEx();
      }));
      wireEx();
      $('edSave').addEventListener('click', () => {
        const mins = Math.max(1, Number($('edMins').value) || 0);
        const date = /^\d{4}-\d{2}-\d{2}$/.test($('edDate').value) ? $('edDate').value : entry.date;
        store.set('entries', getEntries().map(e =>
          e.id === id ? Object.assign({}, e, { cat: cat, exId: exId, mins: mins, date: date }) : e));
        closeModal(); toast('Entry updated'); renderHome();
      });
      $('edDel').addEventListener('click', () => {
        store.set('entries', getEntries().filter(e => e.id !== id));
        closeModal(); toast('Entry deleted'); renderHome();
      });
    });
  }

  // ---------- EXERCISES ----------
  function renderExercises() {
    const exs = getExercises();
    $('exerciseList').innerHTML = CATEGORIES.map(c => {
      const items = exs.filter(x => x.cat === c.key);
      const rows = items.length ? items.map(x => `
        <div class="ex-row">
          <div class="info" data-edit="${x.id}">
            <div class="name">${escapeHtml(x.name)}</div>
            <div class="sub">${x.mins ? formatMins(x.mins) : 'No default time'}${x.notes ? ' · ' + escapeHtml(x.notes) : ''}</div>
          </div>
          <button class="log-btn tm" data-timeex="${x.id}" data-timecat="${c.key}" aria-label="Start timer">▶</button>
          <button class="log-btn" data-logex="${x.id}" data-logcat="${c.key}">Log</button>
        </div>`).join('') : `<div class="ex-empty">No exercises yet.</div>`;
      return `
        <div class="group-head"><h3>${c.emoji} ${c.label}</h3><button class="add-mini" data-addcat="${c.key}">+ Add</button></div>
        <div>${rows}</div>`;
    }).join('');

    document.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => openExerciseEditor(el.dataset.edit)));
    document.querySelectorAll('[data-logex]').forEach(el => el.addEventListener('click', () => openLogSheet(el.dataset.logcat, el.dataset.logex)));
    document.querySelectorAll('[data-timeex]').forEach(el => el.addEventListener('click', () => {
      const ex = getExercises().find(x => x.id === el.dataset.timeex);
      startTimer(el.dataset.timecat, el.dataset.timeex, ex && ex.mins);
    }));
    document.querySelectorAll('[data-addcat]').forEach(el => el.addEventListener('click', () => openExerciseEditor(null, el.dataset.addcat)));
  }
  $('addExerciseBtn').addEventListener('click', () => openExerciseEditor(null, 'reading'));

  // Add / edit an exercise. reopenLog = came from the log sheet, so go back to it after saving.
  function openExerciseEditor(id, defaultCat, reopenLog) {
    const existing = id ? getExercises().find(x => x.id === id) : null;
    let cat = existing ? existing.cat : (defaultCat || 'reading');
    const body = `
      <div class="field"><label>Name</label><input type="text" id="exName" maxlength="60" placeholder="e.g. Box breathing" value="${escapeHtml(existing ? existing.name : '')}"></div>
      <div class="step-label">Category</div>
      <div class="chip-row" id="catChips">
        ${CATEGORIES.map(c => `<button class="chip${c.key === cat ? ' active' : ''}" data-c="${c.key}">${c.emoji} ${c.label}</button>`).join('')}
      </div>
      <div class="field"><label>Usual time (minutes, optional)</label><input type="number" id="exMins" min="0" inputmode="numeric" placeholder="e.g. 10" value="${existing && existing.mins ? existing.mins : ''}"></div>
      <div class="field"><label>How to do it (optional)</label><textarea id="exNotes" maxlength="400" placeholder="Short instructions or a reminder">${escapeHtml(existing ? existing.notes : '')}</textarea></div>
      <button class="btn primary" id="saveEx" style="margin-top:18px;">${existing ? 'Save Changes' : 'Add Exercise'}</button>
      ${existing ? '<div style="text-align:center;margin-top:8px;"><button class="btn danger-text" id="delEx">Delete exercise</button></div>' : ''}`;

    openModal(existing ? 'Edit Exercise' : 'New Exercise', body, () => {
      document.querySelectorAll('#catChips [data-c]').forEach(b => b.addEventListener('click', () => {
        cat = b.dataset.c;
        document.querySelectorAll('#catChips [data-c]').forEach(x => x.classList.toggle('active', x === b));
      }));
      $('saveEx').addEventListener('click', () => {
        const name = $('exName').value.trim();
        if (!name) { toast('Give it a name'); return; }
        const mins = parseInt($('exMins').value, 10);
        const data = { cat, name, mins: mins > 0 ? mins : 0, notes: $('exNotes').value.trim() };
        const exs = getExercises();
        let savedId = id;
        if (existing) Object.assign(exs.find(x => x.id === id), data);
        else { savedId = uid_(); exs.push(Object.assign({ id: savedId }, data)); }
        store.set('exercises', exs);
        toast(existing ? 'Exercise saved' : 'Exercise added');
        renderExercises(); renderHome();
        if (reopenLog) openLogSheet(cat, savedId); else closeModal();
      });
      if (existing) $('delEx').addEventListener('click', () => {
        if (!confirm(`Delete "${existing.name}"? Time you've already logged stays in your totals.`)) return;
        store.set('exercises', getExercises().filter(x => x.id !== id));
        toast('Exercise deleted'); closeModal(); renderExercises(); renderHome();
      });
      if (!existing) setTimeout(() => $('exName').focus(), 50);
    });
  }

  // ---------- HISTORY ----------
  function renderHistory() {
    const targets = getTargets();
    const keys = [...new Set(getEntries().map(e => weekKey(parseYmd(e.date))))].sort().reverse();
    if (!keys.length) {
      $('historyList').innerHTML = `<div class="empty-state"><div class="emoji">▤</div><p>No history yet.</p><p>Your weeks will appear here as you log time.</p></div>`;
      return;
    }
    const now = thisWeekKey();
    $('historyList').innerHTML = keys.map(k => {
      const t = weekTotals(k); const pct = weekPct(t, targets);
      return `
        <div class="week-card">
          <div class="week-head"><span class="range">${k === now ? 'This week' : weekRangeLabel(k)}</span><span class="pct${pct >= 100 ? ' done' : ''}">${pct}%${pct >= 100 ? ' ✓' : ''}</span></div>
          <div class="bar-track"><div class="bar-fill${pct >= 100 ? ' done' : ''}" style="width:${Math.min(pct, 100)}%"></div></div>
          <div class="week-mini">${CATEGORIES.map(c => `<span>${c.emoji} <b>${formatMins(t[c.key])}</b></span>`).join('')}</div>
        </div>`;
    }).join('');
  }

  // ---------- TARGETS ----------
  function renderTargets() {
    const t = getTargets();
    $('targetList').innerHTML = CATEGORIES.map(c => `
      <div class="target-row">
        <span class="te">${c.emoji}</span><span class="tl">${c.label}</span>
        <div class="t-input"><input type="number" min="0" inputmode="numeric" id="target_${c.key}" value="${t[c.key]}"><span class="t-unit">min</span></div>
      </div>`).join('');
  }
  $('saveTargets').addEventListener('click', () => {
    const nt = {};
    CATEGORIES.forEach(c => { const v = parseInt($('target_' + c.key).value, 10); nt[c.key] = isNaN(v) || v < 0 ? 0 : v; });
    store.set('targets', nt);
    toast('Targets saved'); renderHome();
  });

  // ---------- boot ----------
  function migrate() {
    // Version 1 of the app stored per-week totals under 'weeks'. Convert those
    // into entries once, so nothing already logged is lost. (Dated mid-week so
    // time-zone quirks in the old week keys can't push them into the wrong week.)
    const old = store.get('weeks', null);
    if (old && !store.get('migrated_v2', false)) {
      const entries = getEntries();
      Object.keys(old).forEach(wk => Object.keys(old[wk] || {}).forEach(cat => {
        const m = old[wk][cat]; if (m > 0 && catBy(cat)) { const d = parseYmd(wk); d.setDate(d.getDate() + 3); const today = new Date(); if (d > today) d.setTime(today.getTime()); entries.push({ id: uid_(), date: ymd(d), cat, exId: null, mins: m }); }
      }));
      store.set('entries', entries);
      store.set('migrated_v2', true);
    }
    if (!store.get('exercises', null)) store.set('exercises', STARTER_EXERCISES.map(x => Object.assign({ id: uid_() }, x)));
  }

  function boot() {
    migrate();
    onScreenEnter = (name) => {
      if (name === 'home') { renderHome(); renderTimer(); }
      if (name === 'exercises') renderExercises();
      if (name === 'history') renderHistory();
      if (name === 'targets') renderTargets();
    };
    renderHome();
    renderTimer();
  }

  boot();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function(){}); }); }
</script>
<!-- ============================================================
     ECOSYSTEM AUTO-BACKUP
     Paste this block just before </body> in every Forge app.
     It is identical in all of them.

     Once a day, whichever app you happen to open takes a copy of
     everything all the apps have stored on this phone and sends it
     to your own Cloudflare relay. Nothing to remember, nothing to tap.

     It reads the relay address and password from Forge Finance's
     settings, so you only ever set those up once.

     If the relay isn't set up, or the phone is offline, or anything
     at all goes wrong, it gives up quietly. A backup must never be
     the reason an app misbehaves.
     ============================================================ -->
<script>
(function () {
  "use strict";

  var EVERY_HOURS = 24;
  var STAMP_KEY = 'ecosystem_lastBackup';
  var SETTINGS_KEY = 'finance_settings';

  function relay() {
    try {
      var s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
      if (!s || !s.relayUrl || !s.relayKey) return null;
      var base = String(s.relayUrl).trim().replace(/\/+$/, '');
      if (!/^https?:\/\//i.test(base)) base = 'https://' + base;
      return { base: base, key: s.relayKey };
    } catch (e) { return null; }
  }

  function due() {
    try {
      var last = localStorage.getItem(STAMP_KEY);
      if (!last) return true;
      var age = Date.now() - new Date(last).getTime();
      return !(age >= 0) || age > EVERY_HOURS * 3600000;
    } catch (e) { return false; }
  }

  // Everything every app has stored here, exactly as stored.
  function snapshot() {
    var keys = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k === STAMP_KEY) continue;
        keys[k] = localStorage.getItem(k);
      }
    } catch (e) {}
    return {
      v: 1,
      takenAt: new Date().toISOString(),
      takenBy: document.title || location.pathname,
      origin: location.origin,
      keys: keys
    };
  }

  // Send one now. Returns a promise so a Back up now button can report back.
  function send() {
    var r = relay();
    if (!r) return Promise.reject(new Error('No relay set up yet — add it in Forge Finance settings.'));
    var snap = snapshot();
    if (!Object.keys(snap.keys).length) return Promise.reject(new Error('Nothing stored to back up.'));

    return fetch(r.base + '/backup', {
      method: 'POST',
      headers: { 'X-Relay-Key': r.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(snap)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) throw new Error(body.error || ('Relay returned ' + res.status));
        try { localStorage.setItem(STAMP_KEY, new Date().toISOString()); } catch (e) {}
        return body;
      });
    });
  }

  // The automatic one: quiet, and only when it's due.
  function run() {
    if (!relay() || !due()) return;
    send().catch(function () { /* offline or relay down - try again tomorrow */ });
  }

  // So an app's settings screen can offer "Back up now".
  window.ecosystemBackup = { send: send, snapshot: snapshot, relay: relay, stampKey: STAMP_KEY };

  // Ask Android not to evict this app's data when the phone is short on
  // space. Silently ignored where it isn't supported. Harmless either way.
  function askToKeepData() {
    try {
      if (navigator.storage && navigator.storage.persist && navigator.storage.persisted) {
        navigator.storage.persisted().then(function (already) {
          if (!already) navigator.storage.persist().catch(function () {});
        }).catch(function () {});
      }
    } catch (e) {}
  }

  // Well after the app has finished starting up, so it never competes.
  function start() { askToKeepData(); setTimeout(run, 3000); }
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
</script>
<!-- ============================================================
     BACKUP STATUS CARD
     Identical in every app. Put <div id="backupStatus"></div> wherever
     the app should show it (usually its settings/targets screen) and
     this fills it in: when everything was last backed up, and a
     "Back up now" button. Needs the ECOSYSTEM AUTO-BACKUP block above.
     ============================================================ -->
<script>
(function () {
  "use strict";
  function ago(iso) {
    var t = new Date(iso).getTime();
    if (!t || isNaN(t)) return null;
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 2) return 'just now';
    if (m < 60) return m + ' minutes ago';
    var h = Math.round(m / 60);
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    var d = Math.round(h / 24);
    return d + (d === 1 ? ' day ago' : ' days ago');
  }
  function render(msg, tone) {
    var el = document.getElementById('backupStatus');
    if (!el || !window.ecosystemBackup) return;
    var b = window.ecosystemBackup, last = null;
    try { last = localStorage.getItem(b.stampKey); } catch (e) {}
    var set = !!b.relay();
    var age = last ? (Date.now() - new Date(last).getTime()) / 3600000 : null;
    var line = !set ? 'Backups aren’t set up on this phone yet — add your relay in Finance → Settings.'
             : last ? 'Everything your apps hold on this phone was last backed up ' + ago(last) + '.'
             : 'Nothing backed up yet. One goes automatically a few seconds after you open any app.';
    var warn = set && (age === null || age > 48);
    el.innerHTML =
      '<div style="background:var(--bg-raised,var(--surface));border:1px solid var(--line,var(--surface2));border-radius:14px;padding:14px 16px;">' +
        '<div style="font-size:13px;line-height:1.55;color:' + (warn ? 'var(--accent,var(--gold))' : 'var(--ink-soft,var(--muted))') + ';">' +
          (warn && last ? '⚠ ' : '') + line + '</div>' +
        (set ? '<button type="button" id="backupNowBtn2" style="margin-top:10px;width:100%;padding:11px;border-radius:12px;' +
                 'background:var(--surface2);border:1px solid var(--line,var(--faint));color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;">Back up now</button>' : '') +
        (msg ? '<div style="margin-top:8px;font-size:12px;font-weight:700;color:' + (tone === 'bad' ? 'var(--warn,var(--danger))' : 'var(--good,#5FBF6E)') + ';">' + msg + '</div>' : '') +
      '</div>';
    var btn = document.getElementById('backupNowBtn2');
    if (btn) btn.addEventListener('click', function () {
      btn.disabled = true; btn.textContent = 'Backing up…';
      b.send().then(function () { render('Backed up ✓', 'ok'); })
              .catch(function (e) { render('Couldn’t back up: ' + (e && e.message ? e.message : 'unknown error'), 'bad'); });
    });
  }
  window.renderBackupStatus = function () { render(); };
  // Refresh whenever the card's screen is shown or the app comes back to the front.
  new MutationObserver(function () {
    var el = document.getElementById('backupStatus');
    if (el && !el.dataset.done && el.offsetParent !== null) { el.dataset.done = '1'; render(); }
    else if (el && el.offsetParent === null) { delete el.dataset.done; }
  }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'], childList: true });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  if (document.readyState === 'complete') render(); else window.addEventListener('load', render);
})();
</script>
